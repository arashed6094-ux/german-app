{t:"weil / dass / obwohl / wenn: الفعل في آخر الجملة",r:"الجملة الفرعية (Nebensatz) هي جملة بتبدأ بكلمة ربط زي: weil (لأن)، dass (إنّ / أن)، obwohl (رغم إن)، wenn (لو / لما)، ob (إذا / هل).\nالقاعدة الذهبية: الفعل المصرّف بيروح في آخر الجملة الفرعية.\nمثال: Ich bleibe zu Hause, weil ich krank bin. (bin في الآخر)\nلو الجملة الفرعية جت الأول، الجملة الرئيسية بعدها بتبدأ بالفعل: Weil ich müde bin, gehe ich nach Hause.\nلو عندك فعل مساعد + فعل أساسي، المصرّف هو الأخير: ...weil ich Deutsch lernen muss.\nالغلطة الشائعة: weil ich bin müde ❌ والصح: weil ich müde bin ✅",x:[["Ich bleibe zu Hause, weil ich krank bin.","أنا قاعد في البيت لأني تعبان"],["Er sagt, dass er morgen kommt.","بيقول إنه جاي بكرة"],["Obwohl es regnet, gehen wir spazieren.","رغم إن المطر نازل، هنتمشى"],["Weil ich Deutsch lernen muss, übe ich jeden Tag.","علشان لازم أتعلم ألماني، بتمرن كل يوم"]],q:[["Ich lerne Deutsch, weil ich in Deutschland arbeiten möchte.","Ich lerne Deutsch, weil ich möchte in Deutschland arbeiten.","Ich lerne Deutsch, weil möchte ich in Deutschland arbeiten."],["Sie sagt, dass sie heute keine Zeit hat.","Sie sagt, dass sie hat heute keine Zeit.","Sie sagt, dass hat sie heute keine Zeit."],["Obwohl er müde ist, arbeitet er weiter.","Obwohl er ist müde, arbeitet er weiter.","Obwohl er müde ist, er arbeitet weiter."],["Ich weiß nicht, ob er kommt.","Ich weiß nicht, ob kommt er.","Ich weiß nicht, ob er kommen."],["Wenn ich Zeit habe, rufe ich dich an.","Wenn ich habe Zeit, rufe ich dich an.","Wenn ich Zeit habe, ich rufe dich an."]]},

r.textContent=(j.cached?'📦 موجود في قاعدة البيانات، من غير ما نستهلك حصة Gemini.':'✅ اتولّد واتحفظ في قاعدة البيانات.')+'\n'+j.items.map(FM[k]).join('\n')+'\n('+n+' جديد على موبايلك)'}catch(e){r.textContent='⚠️ '+e.message}}
var TI,CHF,CHL='',OP=0,SH=null,TUB=0,FR=[],PG='',PF=new URLSearchParams(location.search).get('f');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function prof(){const p=S.prof||{};$('#v').innerHTML=`<div class="fc" style="text-align:start"><b style="font-size:20px">أهلاً! عرّفنا بنفسك 👋</b><label style="display:block;margin-top:10px">الاسم</label><input id="pf" value="${esc(p.name||'')}"><label>النوع</label><div class="row"><button class="bt gh" id="g1" onclick="pg('m')">ذكر</button><button class="bt gh" id="g2" onclick="pg('f')">أنثى</button></div><label style="display:block;margin-top:10px">تاريخ الميلاد</label><input id="pb" type="date" value="${p.birth||''}"><label>الرمز السري (APP_PIN)</label><input id="pp" type="password" value="${esc(S.pin)}"><button class="bt" onclick="ps()">حفظ وابدأ</button><div id="pe"></div><button class="gh" onclick="S.skip=1;save();home()">تخطّي الآن</button></div>`;pg(p.gender||'')}
function pg(g){PG=g;['m','f'].forEach((x,i)=>{$('#g'+(i+1)).style.outline=g==x?'3px solid var(--p)':'none'})}
async function ps(){const n=$('#pf').value.trim(),b=$('#pb').value,p=$('#pp').value.trim(),e=$('#pe');if(!n||!PG||!b||!p){e.className='res y';e.textContent='كمّل كل الخانات';return}
S.pin=p;e.className='res';e.textContent='بحفظ...';const id=(S.prof&&S.prof.id)||(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));
try{const j=await call({action:'profile_save',me:id,name:n,gender:PG,birth:b});S.prof={id,name:n,gender:PG,birth:b,code:j.code};save();home();sync();pend()}catch(x){e.className='res r';e.textContent='⚠️ '+x.message}}
async function pend(){if(!PF||!S.prof||!S.pin)return;const c=PF;PF=null;history.replaceState(null,'',location.pathname);try{const j=await call({action:'friend_add',me:S.prof.id,code:c});toast('🤝 اتضاف '+j.friend.name+' كصديق')}catch(e){toast('⚠️ '+e.message)}}
async function topup(t){if(TUB||!S.pin)return;TUB=1;try{await sync();if(IT(t).filter(i=>!lr(i.k)).length<6){const k=t=='x'?'expr':'word',j=await call({action:'generate',kind:k,mode:S.mode,q:'',have:KEYS(k,S.mode)});add(k,S.mode,j.items)}}catch(e){}TUB=0}
async function chat(){if(!S.prof){prof();return}clearInterval(TI);$('#v').innerHTML=back+'<p class="mut">بحمّل...</p>';
try{const j=await call({action:'friends',me:S.prof.id});FR=j.friends;
$('#v').innerHTML=back+(FR.length?FR.map((f,i)=>`<button class="op" onclick="oc(${i})">👤 ${esc(f.name)}</button>`).join(''):'<p class="mut">لسه مفيش أصدقاء. ابعت الدعوة لزميلك أو اكتب كوده.</p>')+`<div class="fc" style="text-align:start"><label>كودك: <b dir="ltr">${S.prof.code}</b></label><button class="bt" onclick="invt()">📨 ابعت دعوة (رابط البرنامج)</button><label style="display:block;margin-top:14px">أضف صديق بالكود</label><input id="fc2" dir="ltr" placeholder="مثلاً: K7M2QX"><button class="gh" onclick="fa()">إضافة</button><div id="fe"></div></div>`}catch(e){$('#v').innerHTML=back+'<p class="res r">⚠️ '+esc(e.message)+'</p>'}}
async function invt(){const u=location.origin+location.pathname+'?f='+S.prof.code;try{if(navigator.share)await navigator.share({title:'ألماني',text:'انضم لي في برنامج تعلم الألماني 🇩🇪',url:u});else{await navigator.clipboard.writeText(u);toast('اتنسخ الرابط ✅')}}catch(e){}}
async function fa(){const c=$('#fc2').value.trim(),e=$('#fe');if(!c)return;try{const j=await call({action:'friend_add',me:S.prof.id,code:c});e.className='res g';e.textContent='🤝 اتضاف '+j.friend.name;setTimeout(chat,900)}catch(x){e.className='res r';e.textContent='⚠️ '+x.message}}
function oc(i){CHF=FR[i];OP=0;CHL='';$('#v').innerHTML=`<button class="gh bk" onclick="chat()">→ رجوع</button> <b>${esc(CHF.name)}</b><div id="ml" class="ml"></div><div id="ce"></div><div class="row"><input id="mi" placeholder="اكتب رسالة..." style="margin:0" onkeydown="if(event.key==='Enter')sm()"><button class="bt" style="flex:0 0 80px;margin:0" onclick="sm()">إرسال</button></div>`;cp();clearInterval(TI);TI=setInterval(cp,4000)}
async function cp(){if(!$('#ml')){clearInterval(TI);return}const c=$('#ce');try{const j=await call({action:'msgs',me:S.prof.id,other:CHF.id}),h=JSON.stringify(j.msgs)+OP;if(c&&c.textContent.startsWith('⚠️ مش قادر')){c.textContent='';c.className=''}if(h==CHL||!$('#ml'))return;CHL=h;const ml=$('#ml'),end=ml.scrollHeight-ml.scrollTop-ml.clientHeight<80;ml.innerHTML=j.msgs.map(mh).join('')||'<p class="mut">ابدأ المحادثة 👋</p>';if(end)ml.scrollTop=ml.scrollHeight}catch(e){if(c&&!c.textContent){c.className='res r';c.textContent='⚠️ مش قادر أحمّل الرسائل: '+e.message+' (جرّب ⚙️ ثم 🩺 فحص النظام)'}}}
function mh(m){const me=m.sender==S.prof.id,cn={};Object.values(m.reactions||{}).forEach(e=>cn[e]=(cn[e]||0)+1);const ks=Object.keys(cn);
return `<div class="m ${me?'me':''}" onclick="OP=OP==${m.id}?0:${m.id};CHL='';cp()">${m.shared?shw(m.shared):''}${m.body?`<div>${esc(m.body)}</div>`:''}${ks.length?'<div class="rx">'+ks.map(e=>e+(cn[e]>1?' '+cn[e]:'')).join('  ')+'</div>':''}${OP==m.id?'<div class="eb">'+['👍','❤️','😂','🎉','😮'].map(e=>`<button onclick="event.stopPropagation();rc(${m.id},'${e}')">${e}</button>`).join('')+'</div>':''}</div>`}
async function rc(id,e){OP=0;try{await call({action:'react',me:S.prof.id,id,emoji:e})}catch(x){toast('⚠️ '+x.message)}CHL='';cp()}
async function sm(){const i=$('#mi'),t=i.value.trim(),e=$('#ce');if(!t)return;i.value='';e.className='';e.textContent='';
const ml=$('#ml');ml.insertAdjacentHTML('beforeend',`<div class="m me" style="opacity:.6">${esc(t)} ⏳</div>`);ml.scrollTop=ml.scrollHeight;
try{await call({action:'send',me:S.prof.id,other:CHF.id,body:t})}catch(x){i.value=t;e.className='res r';e.textContent='⚠️ الرسالة ماتبعتتش: '+x.message+' (جرّب ⚙️ ثم 🩺 فحص النظام)';CHL='';cp();return}CHL='';cp()}
function shw(s){const d=s.data,k=s.kind;let h;
if(k=='word')h=`<b dir="ltr">${esc((d[0]+' '+d[1]).trim())}</b><div>${esc(d[2])}</div>`;
else if(k=='expr')h=`<b dir="ltr">${esc(d[0])}</b><div>${esc(d[1])}</div><div dir="ltr">${esc(d[2])}</div>`;
else if(k=='grammar')h=`<b>${esc(d.t)}</b><div>${esc(String(d.r||'').slice(0,160))}…</div><div dir="ltr">${esc((d.x&&d.x[0]&&d.x[0][0])||d.e||'')}</div>`;
else h=`<b dir="ltr">${esc(d.c)}</b><div>${esc(d.a)}</div><div dir="ltr">✅ ${esc((d.o.find(x=>x[1]==2)||d.o[0])[0])}</div>`;
const sp=k=='word'?d[0]+' '+d[1]:k=='expr'?(d[2]||d[0]):k=='grammar'?((d.x&&d.x[0]&&d.x[0][0])||d.e||d.t):d.c;
return `<div class="sh">📌 ${h}<button class="ch2" onclick="event.stopPropagation();say(${JSON.stringify(String(sp)).replace(/"/g,'&quot;')})">🔊</button></div>`}
async function shr(kind,d){if(!S.prof){prof();return}SH={kind,data:d};
try{const j=await call({action:'friends',me:S.prof.id});FR=j.friends;if(!FR.length){toast('ضيف صديق الأول من 👥');return}if(FR.length==1)return sd(0);
const m=document.createElement('div');m.className='mdl';m.id='mdl';m.innerHTML=`<div class="fc">ابعت لمين؟${FR.map((f,i)=>`<button class="op" onclick="sd(${i})">${esc(f.name)}</button>`).join('')}<button class="gh" onclick="$('#mdl').remove()">إلغاء</button></div>`;document.body.appendChild(m)}catch(e){toast('⚠️ '+e.message)}}
async function sd(i){const m=$('#mdl');if(m)m.remove();try{await call({action:'send',me:S.prof.id,other:FR[i].id,shared:SH,body:''});toast('📤 اتبعت لـ '+FR[i].name)}catch(e){toast('⚠️ '+e.message)}}
var GRW=0,LG={};
function stt(k){let L,l;if(k=='word'){L=WL();l=L.filter(d=>lr(d[1]))}else if(k=='expr'){L=XL();l=L.filter(d=>lr(d[0]))}else if(k=='grammar'){L=GL();l=L.filter(g=>S.gk[g.t])}else{L=SL();l=L.filter(x=>S.sm[x.c])}return{n:L.length,l:l.length}}
async function grow(){if(GRW||!S.pin)return;GRW=1;
try{const ks=[['word',S.mode],['expr',S.mode],['grammar','a']];if(S.mode=='c')ks.push(['sim','c']);
for(const[k,m]of ks){const st=stt(k);if(st.n&&st.l/st.n>=.6&&Date.now()-(LG[k+m]||0)>6e5){LG[k+m]=Date.now();let n=Math.max(1,Math.ceil(st.n*.2));if(k=='grammar'||k=='sim')n=Math.min(n,3);
const j=await call({action:'generate',kind:k,mode:m,q:'',n,have:KEYS(k,m)}),a=add(k,m,j.items);if(a)toast('✨ اتضاف '+a+' '+({word:'كلمات',expr:'تعبيرات',grammar:'دروس جرامر',sim:'مكالمات'}[k])+' جديدة')}}}catch(e){}GRW=0}
async function dg(){const r=$('#dgr');r.className='res';r.textContent='بفحص...';try{r.textContent=(await call({action:'diag'})).report}catch(e){r.textContent='⚠️ '+e.message}}
head();S.prof?home():prof();sync().then(grow);pend();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
