CO=ds.concat(CA).sort(()=>Math.random()-.5);
$('#v').innerHTML=back+note()+`<div class="fc ${x?'':d[0]}"><div class="mut" style="margin-top:0">${rv?'مراجعة':'●'.repeat(c)+'○'.repeat(3-c)}</div><div class="${x?'w s':'w'}">${x?d[0]:(d[0]?`<span class="a ${d[0]}">${d[0]}</span> `:'')+d[1]}</div><button class="gh sp" onclick="say(CI.t=='x'?CI.d[0]:(CI.d[0]+' '+CI.d[1]).trim())">🔊</button></div><p class="mut">اختار المعنى الصح:</p>`+CO.map((o,j)=>`<button class="op" onclick="pc(${j})">${o}</button>`).join('')+'<div id="r"></div>'}
function pc(j){const k=CI.k,ok=CO[j]==CA,x=CI.t=='x';document.querySelectorAll('.op').forEach((b,n)=>{b.disabled=1;if(CO[n]==CA)b.style.border='3px solid var(--das)';else if(n==j)b.style.border='3px solid var(--die)'});
if(RV){if(ok)xp(2);else{S.ok[k]=1;save()}}else if(ok)good(k);else bad(k);
say(x?CI.d[0]:(CI.d[0]+' '+CI.d[1]).trim());
$('#r').innerHTML=(ok?'<p class="res g">صح! 🎉</p>':'<p class="res r">الصح: '+CA+'</p>')+(x?`<p class="eg">${CI.d[2]}</p>`:'')+'<button class="gh" onclick="shr(CI.t==\'x\'?\'expr\':\'word\',CI.d)">📤 شارك مع صديق</button><button class="bt" onclick="cards(CT,RV)">التالي</button>'}
function art(){const L=WL().filter(d=>d[0]),U=L.filter(d=>!lr(d[1])),d=CW=R(U.length?U:L);
$('#v').innerHTML=back+note()+`<div class="fc"><div class="mut" style="margin-top:0">صح متتالي: ${q}</div><div class="w">${d[1]}</div><div class="ar">${d[2]}</div></div><div class="row3">`+['der','die','das'].map(a=>`<button class="bt ${a}" onclick="ga(this,'${a}')">${a}</button>`).join('')+'</div>'}
function ga(b,a){document.querySelectorAll('.row3 button').forEach(x=>x.disabled=1);if(a==CW[0]){q++;good(CW[1]);b.classList.add('ok');say(CW[0]+' '+CW[1])}else{q=0;bad(CW[1]);b.classList.add('no');document.querySelector('.row3 .'+CW[0]).classList.add('ok')}setTimeout(art,1100)}
function gl(){$('#v').innerHTML=back+GL().map((g,i)=>`<button class="op" onclick="gv(${i})">${S.gr[i]==2?'✅ ':''}${g.t}</button>`).join('')+'<button class="bt" onclick="gen()">✨ درس جديد بالـ AI</button>'}
function gv(i){const g=GL()[i];$('#v').innerHTML=`<button class="gh bk" onclick="gl()">→ رجوع</button><div class="fc"><b>${g.t}</b><p class="ar" style="font-size:17px">${g.r}</p><p class="eg">${g.e}</p><button class="gh sp" onclick="say(GL()[${i}].e)">🔊</button></div><button class="gh" onclick="shr('grammar',GL()[${i}])">📤 شارك مع صديق</button><button class="bt" onclick="gq(${i},0,0)">ابدأ التمرين</button>`}
function gq(i,n,sc){const z=GL()[i].q[n];GQ=[i,n,sc,z[1]];const o=z[0].map((s,j)=>[s,j]).sort(()=>Math.random()-.5);
$('#v').innerHTML=`<button class="gh bk" onclick="gl()">→ رجوع</button><p class="mut">أي جملة صحيحة؟ (${n+1}/2)</p>`+o.map(x=>`<button class="op" dir="ltr" onclick="gc(${x[1]})">${x[0]}</button>`).join('')+'<div id="r"></div>'}
function gc(j){const[i,n,sc,c]=GQ,ok=j==c;document.querySelectorAll('.op').forEach(x=>x.disabled=1);if(ok)xp(5);const s=sc+(ok?1:0);
$('#r').innerHTML=`<p class="res ${ok?'g':'r'}">${ok?'صح! 🎉':'غلط. الصح: '+GL()[i].q[n][0][c]}</p><button class="bt" onclick="${n<1?`gq(${i},1,${s})`:`gd(${i},${s})`}">${n<1?'التالي':'خلصت'}</button>`}
function gd(i,s){S.gr[i]=Math.max(S.gr[i]||0,s);save();gl()}
function bld(){const p=R(P[S.mode]);B={t:p[0],a:p[1],pool:p[0].split(' ').sort(()=>Math.random()-.5),ans:[]};drw()}
function drw(){const done=!B.pool.length,ok=B.ans.join(' ')==B.t,b=(a,f)=>a.map((w,i)=>`<button class="ch2" onclick="${f}(${i})">${w}</button>`).join('');
$('#v').innerHTML=back+`<div class="fc"><div class="ar" style="margin:0">${B.a}</div><div class="ans" dir="ltr">${b(B.ans,'bu')}</div></div><div class="ans" dir="ltr">${b(B.pool,'bp')}</div>`+(done?`<p class="res ${ok?'g':'r'}">${ok?'صح! 🎉':'مش مظبوطة. الصح:<br>'+B.t}</p><button class="bt" onclick="bld()">التالي</button>`:'')}
function bp(i){B.ans.push(B.pool.splice(i,1)[0]);if(!B.pool.length&&B.ans.join(' ')==B.t){xp(15);say(B.t)}drw()}
function bu(i){B.pool.push(B.ans.splice(i,1)[0]);drw()}
function stats(){const sec=t=>{const L=IT(t);return{L,ln:L.filter(i=>lr(i.k)),pr:L.filter(i=>!lr(i.k)&&S.ok[i.k])}},w=sec('w'),x=sec('x'),
blk=(n,s)=>`<div class="fc" style="text-align:start"><b>${n}: ${s.ln.length} من ${s.L.length} محفوظة</b><div class="bar"><i style="width:${s.L.length?s.ln.length/s.L.length*100:0}%"></i></div><p class="mut" style="text-align:start">✅ محفوظة</p><div class="ans" dir="ltr">${s.ln.map(i=>`<span class="ch2">${i.k}</span>`).join('')||'-'}</div><p class="mut" style="text-align:start">⏳ في التعلّم</p><div class="ans" dir="ltr">${s.pr.map(i=>`<span class="ch2">${i.k} ${S.ok[i.k]}/3</span>`).join('')||'-'}</div></div>`;
$('#v').innerHTML=back+`<div class="fc"><div class="w">${w.ln.length+x.ln.length}</div><p>إجمالي المحفوظ في ${S.mode=='c'?'خدمة العملاء':'القسم العام'}</p></div>`+blk('الكلمات',w)+blk('التعبيرات',x)+`<p class="mut">⭐ ${S.xp} نقطة | 🔥 ${stk()} يوم | 🛡️ ${S.fz||0} (باقي ${7-stk()%7} يوم للحماية الجاية)</p>`}
function sim(){const s=CS=R(SL());
$('#v').innerHTML=back+`<div class="fc"><div class="w s">${s.c}</div><div class="ar">${s.a}</div><button class="gh sp" onclick="say(CS.c)">🔊</button></div><button class="gh" onclick="shr('sim',CS)">📤 شارك مع صديق</button><p class="mut">اختار ردك:</p>`+s.o.map((o,i)=>`<button class="op" dir="ltr" onclick="sa(${i})">${o[0]}</button>`).join('')+'<div id="r"></div>'}
function sa(i){const o=CS.o[i];document.querySelectorAll('.op').forEach(x=>x.disabled=1);xp(o[1]*5);say(o[0]);
$('#r').innerHTML=`<p class="res ${['r','y','g'][o[1]]}">${o[1]}/2: ${o[2]}</p><button class="bt" onclick="sim()">مكالمة تانية</button>`}
async function call(b){if(!S.pin)throw new Error('اكتب الرمز السري من ⚙️ الأول');
const r=await fetch(S.url||URL_,{method:'POST',headers:{'Content-Type':'application/json','x-app-pin':S.pin},body:JSON.stringify(b)});
const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'خطأ '+r.status);return j}
const ask=(prompt,system)=>call({prompt,system}).then(j=>j.text);
function ai(){CMs=S.mode=='c'?R(CM):'';
$('#v').innerHTML=back+(CMs?`<div class="fc"><p class="mut" style="margin-top:0">العميل بيقول:</p><div class="w s">${CMs}</div></div>`:'')+`<textarea id="t" dir="ltr" rows="4" placeholder="${CMs?'اكتب ردك بالألمانية...':'اكتب جملة بالألمانية...'}"></textarea><button class="bt" id="go" onclick="go()">${CMs?'قيّم ردي':'صحّح'}</button><div id="r"></div>`}
async function go(){const t=$('#t').value.trim();if(!t)return;const b=$('#go'),r=$('#r');b.disabled=1;r.className='res';r.textContent='بفكر...';
try{r.textContent=(await ask(t,CMs?SYC+CMs:SYG)).replace(/\*\*/g,'');xp(10)}catch(e){r.textContent='⚠️ '+e.message}b.disabled=0}
function set(){$('#v').innerHTML=back+`<p class="mut">${S.prof?esc(S.prof.name)+' | '+(S.prof.gender=='f'?'أنثى':'ذكر')+' | '+Math.floor((Date.now()-new Date(S.prof.birth))/315576e5)+' سنة':''}</p><div class="fc" style="text-align:start"><label>الرمز السري (نفس APP_PIN في Supabase)</label><input id="pn" type="password" value="${S.pin}"><label>رابط الـ Function (سيبه كده لو مش هتغيّره)</label><input id="ur" dir="ltr" value="${S.url}" placeholder="${URL_}"><button class="gh" onclick="prof()">👤 تعديل الملف الشخصي</button><button class="gh" onclick="S.dark^=1;save();head()">🌓 داكن / فاتح</button><button class="bt" onclick="S.pin=$('#pn').value.trim();S.url=$('#ur').value.trim();save();home()">حفظ</button></div>`}
var CO,CA;
const KEYS=(k,m)=>k=='word'?W[m].map(d=>d[1]):k=='expr'?X[m].map(d=>d[0]):k=='grammar'?G.map(g=>g.t):SM.map(s=>s.c);
const KF={word:d=>d[1],expr:d=>d[0],grammar:d=>d.t,sim:d=>d.c},FM={word:d=>(d[0]+' '+d[1]+' = '+d[2]).trim(),expr:d=>d[0]+' = '+d[1],grammar:d=>d.t,sim:d=>d.c};
function add(k,m,items){const L=S.ai[m][k],h=KEYS(k,m);let n=0;items.forEach(d=>{const x=KF[k](d);if(!L.some(y=>KF[k](y)==x)&&!h.includes(x)){L.push(d);n++}});save();return n}
async function sync(){if(!S.pin)return;try{const j=await call({action:'list',mode:S.mode});j.rows.forEach(r=>S.ai[r.mode]&&S.ai[r.mode][r.kind]&&add(r.kind,r.mode,[r.data]))}catch(e){}}
function gen(){const c=S.mode=='c',b=(k,t)=>`<button class="op" onclick="mk('${k}')">🆕 ${t}</button>`;
$('#v').innerHTML=back+'<p class="mut">أي محتوى جديد بيتحفظ في قاعدة البيانات ويظهر عند الاتنين، وما بيستهلكش حصة Gemini تاني.</p>'+b('word','10 كلمات جديدة')+b('expr','8 تعبيرات جديدة')+b('grammar','درس جرامر جديد')+(c?b('sim','محادثة جديدة'):'')+`<div class="fc" style="text-align:start"><label>دوّر على كلمة أو تعبير أو قاعدة معيّنة</label><input id="sq" dir="ltr" placeholder="مثلاً: Kulanz"><div class="row"><button class="bt" onclick="mk('word',1)">كلمة</button><button class="bt" onclick="mk('expr',1)">تعبير</button><button class="bt" onclick="mk('grammar',1)">قاعدة</button></div></div><div id="gr"></div>`}
async function mk(k,s){const r=$('#gr'),q=s?$('#sq').value.trim():'';if(s&&!q){r.className='res y';r.textContent='اكتب الكلمة الأول';return}
r.className='res';r.textContent='بجهّز... (ممكن ياخد ثواني)';const m=k=='grammar'?'a':S.mode;
try{const j=await call({action:'generate',kind:k,mode:m,q,have:KEYS(k,m)}),n=add(k,m,j.items);xp(5);
r.textContent=(j.cached?'📦 موجود في قاعدة البيانات، من غير ما نستهلك حصة Gemini.':'✅ اتولّد واتحفظ في قاعدة البيانات.')+'\n'+j.items.map(FM[k]).join('\n')+'\n('+n+' جديد على موبايلك)'}catch(e){r.textContent='⚠️ '+e.message}}
var TI,CHF,CHL='',OP=0,SH=null,TUB=0,FR=[],PG='',PF=new URLSearchParams(location.search).get('f');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function prof(){const p=S.prof||{};$('#v').innerHTML=`<div class="fc" style="text-align:start"><b style="font-size:20px">أهلاً! عرّفنا بنفسك 👋</b><label style="display:block;margin-top:10px">الاسم</label><input id="pf" value="${esc(p.name||'')}"><label>النوع</label><div class="row"><button class="bt gh" id="g1" onclick="pg('m')">ذكر</button><button class="bt gh" id="g2" onclick="pg('f')">أنثى</button></div><label style="display:block;margin-top:10px">تاريخ الميلاد</label><input id="pb" type="date" value="${p.birth||''}"><label>الرمز السري (APP_PIN)</label><input id="pp" type="password" value="${esc(S.pin)}"><button class="bt" onclick="ps()">حفظ وابدأ</button><div id="pe"></div></div>`;pg(p.gender||'')}
function pg(g){PG=g;['m','f'].forEach((x,i)=>{$('#g'+(i+1)).style.outline=g==x?'3px solid var(--p)':'none'})}
async function ps(){const n=$('#pf').value.trim(),b=$('#pb').value,p=$('#pp').value.trim(),e=$('#pe');if(!n||!PG||!b||!p){e.className='res y';e.textContent='كمّل كل الخانات';return}
S.pin=p;e.className='res';e.textContent='بحفظ...';const id=(S.prof&&S.prof.id)||(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2));
try{const j=await call({action:'profile_save',me:id,name:n,gender:PG,birth:b});S.prof={id,name:n,gender:PG,birth:b,code:j.code};save();home();sync();pend()}catch(x){e.className='res r';e.textContent='⚠️ '+x.message}}
async function pend(){if(!PF||!S.prof||!S.pin)return;const c=PF;PF=null;history.replaceState(null,'',location.pathname);try{const j=await call({action:'friend_add',me:S.prof.id,code:c});toast('🤝 اتضاف '+j.friend.name+' كصديق')}catch(e){toast('⚠️ '+e.message)}}
async function topup(t){if(TUB||!S.pin)return;TUB=1;try{await sync();if(IT(t).filter(i=>!lr(i.k)).length<6){const k=t=='x'?'expr':'word',j=await call({action:'generate',kind:k,mode:S.mode,q:'',have:KEYS(k,S.mode)});add(k,S.mode,j.items)}}catch(e){}TUB=0}
async function chat(){if(!S.prof){prof();return}clearInterval(TI);$('#v').innerHTML=back+'<p class="mut">بحمّل...</p>';
try{const j=await call({action:'friends',me:S.prof.id});FR=j.friends;
$('#v').innerHTML=back+(FR.length?FR.map((f,i)=>`<button class="op" onclick="oc(${i})">👤 ${esc(f.name)}</button>`).join(''):'<p class="mut">لسه مفيش أصدقاء. ابعت الدعوة لزميلك أو اكتب كوده.</p>')+`<div class="fc" style="text-align:start"><label>كودك: <b dir="ltr">${S.prof.code}</b></label><button class="bt" onclick="invt()">📨 ابعت دعوة (رابط البرنامج)</button><label style="display:block;margin-top:14px">أضف صديق بالكود</label><input id="fc2" dir="ltr" placeholder="مثلاً: K7M2QX"><button class="gh" onclick="fa()">إضافة</button><div id="fe"></div></div>`}catch(e){$('#v').innerHTML=back+'<p class="res r">⚠️ '+esc(e.message)+'</p>'}}
async function invt(){const u=location.origin+location.pathname+'?f='+S.prof.code;try{if(navigator.share)await navigator.share({title:'ألماني',text:'انضم لي في برنامج تعلم الألماني 🇩🇪',url:u});else{await navigator.clipboard.writeText(u);toast('اتنسخ الرابط ✅')}}catch(e){}}
async function fa(){const c=$('#fc2').value.trim(),e=$('#fe');if(!c)return;try{const j=await call({action:'friend_add',me:S.prof.id,code:c});e.className='res g';e.textContent='🤝 اتضاف '+j.friend.name;setTimeout(chat,900)}catch(x){e.className='res r';e.textContent='⚠️ '+x.message}}
function oc(i){CHF=FR[i];OP=0;CHL='';$('#v').innerHTML=`<button class="gh bk" onclick="chat()">→ رجوع</button> <b>${esc(CHF.name)}</b><div id="ml" class="ml"></div><div class="row"><input id="mi" placeholder="اكتب رسالة..." style="margin:0"><button class="bt" style="flex:0 0 80px;margin:0" onclick="sm()">إرسال</button></div>`;cp();clearInterval(TI);TI=setInterval(cp,4000)}
async function cp(){if(!$('#ml')){clearInterval(TI);return}try{const j=await call({action:'msgs',me:S.prof.id,other:CHF.id}),h=JSON.stringify(j.msgs)+OP;if(h==CHL||!$('#ml'))return;CHL=h;const ml=$('#ml'),end=ml.scrollHeight-ml.scrollTop-ml.clientHeight<80;ml.innerHTML=j.msgs.map(mh).join('')||'<p class="mut">ابدأ المحادثة 👋</p>';if(end)ml.scrollTop=ml.scrollHeight}catch(e){}}
function mh(m){const me=m.sender==S.prof.id,cn={};Object.values(m.reactions||{}).forEach(e=>cn[e]=(cn[e]||0)+1);const ks=Object.keys(cn);
return `<div class="m ${me?'me':''}" onclick="OP=OP==${m.id}?0:${m.id};CHL='';cp()">${m.shared?shw(m.shared):''}${m.body?`<div>${esc(m.body)}</div>`:''}${ks.length?'<div class="rx">'+ks.map(e=>e+(cn[e]>1?' '+cn[e]:'')).join('  ')+'</div>':''}${OP==m.id?'<div class="eb">'+['👍','❤️','😂','🎉','😮'].map(e=>`<button onclick="event.stopPropagation();rc(${m.id},'${e}')">${e}</button>`).join('')+'</div>':''}</div>`}
async function rc(id,e){OP=0;try{await call({action:'react',me:S.prof.id,id,emoji:e})}catch(x){toast('⚠️ '+x.message)}CHL='';cp()}
async function sm(){const i=$('#mi'),t=i.value.trim();if(!t)return;i.value='';try{await call({action:'send',me:S.prof.id,other:CHF.id,body:t})}catch(e){i.value=t;toast('⚠️ '+e.message);return}CHL='';cp()}
function shw(s){const d=s.data,k=s.kind;let h;
if(k=='word')h=`<b dir="ltr">${esc((d[0]+' '+d[1]).trim())}</b><div>${esc(d[2])}</div>`;
else if(k=='expr')h=`<b dir="ltr">${esc(d[0])}</b><div>${esc(d[1])}</div><div dir="ltr">${esc(d[2])}</div>`;
else if(k=='grammar')h=`<b>${esc(d.t)}</b><div>${esc(d.r)}</div><div dir="ltr">${esc(d.e)}</div>`;
else h=`<b dir="ltr">${esc(d.c)}</b><div>${esc(d.a)}</div><div dir="ltr">✅ ${esc((d.o.find(x=>x[1]==2)||d.o[0])[0])}</div>`;
const sp=k=='word'?d[0]+' '+d[1]:k=='expr'?(d[2]||d[0]):k=='grammar'?d.e:d.c;
return `<div class="sh">📌 ${h}<button class="ch2" onclick="event.stopPropagation();say(${JSON.stringify(sp).replace(/"/g,'&quot;')})">🔊</button></div>`}
async function shr(kind,d){if(!S.prof){prof();return}SH={kind,data:d};
try{const j=await call({action:'friends',me:S.prof.id});FR=j.friends;if(!FR.length){toast('ضيف صديق الأول من 👥');return}if(FR.length==1)return sd(0);
const m=document.createElement('div');m.className='mdl';m.id='mdl';m.innerHTML=`<div class="fc">ابعت لمين؟${FR.map((f,i)=>`<button class="op" onclick="sd(${i})">${esc(f.name)}</button>`).join('')}<button class="gh" onclick="$('#mdl').remove()">إلغاء</button></div>`;document.body.appendChild(m)}catch(e){toast('⚠️ '+e.message)}}
async function sd(i){const m=$('#mdl');if(m)m.remove();try{await call({action:'send',me:S.prof.id,other:FR[i].id,shared:SH,body:''});toast('📤 اتبعت لـ '+FR[i].name)}catch(e){toast('⚠️ '+e.message)}}
head();S.prof?home():prof();sync();pend();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
